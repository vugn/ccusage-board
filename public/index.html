<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ccusage-board</title>
<style>
  :root {
    --bg: #0e0f11; --panel: #16181b; --line: #24272c; --text: #e8e6e1; --muted: #8b8f96;
    --accent: #f2a93b; --good: #5cc98a; --bad: #ef6b5b;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f6f5f2; --panel: #fff; --line: #e4e2dd; --text: #1b1c1e; --muted: #6b6f76; --accent: #c77a0a; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 var(--sans); }
  main { max-width: 1180px; margin: 0 auto; padding: 28px 20px 60px; }
  header { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 24px; }
  h1 { font: 600 18px var(--mono); margin: 0; letter-spacing: -.02em; }
  h1 span { color: var(--accent); }
  h2 { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 14px; }
  .status { display: flex; align-items: center; gap: 8px; color: var(--muted); font: 12px var(--mono); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .dot.live { background: var(--good); box-shadow: 0 0 0 0 var(--good); animation: pulse 2s infinite; }
  .dot.err { background: var(--bad); }
  @keyframes pulse { 70% { box-shadow: 0 0 0 6px transparent; } }
  @media (prefers-reduced-motion: reduce) { .dot.live { animation: none; } }
  .spacer { flex: 1; }
  .tabs { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .tabs button, .btn { background: none; border: 0; color: var(--muted); font: 12px var(--mono); padding: 7px 12px; cursor: pointer; }
  .tabs button[aria-pressed="true"] { background: var(--line); color: var(--text); }
  .btn { border: 1px solid var(--line); border-radius: 8px; color: var(--text); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px; }
  .grid { display: grid; gap: 14px; }
  .kpis { grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); margin-bottom: 14px; }
  .kpi .label { color: var(--muted); font-size: 12px; }
  .kpi .value { font: 600 28px var(--mono); letter-spacing: -.03em; margin-top: 6px; }
  .kpi .sub { color: var(--muted); font: 12px var(--mono); margin-top: 2px; }
  .two { grid-template-columns: 1fr 1fr; margin-top: 14px; }
  @media (max-width: 820px) { .two { grid-template-columns: 1fr; } }
  #block { margin-bottom: 14px; }
  .block-row { display: flex; gap: 28px; flex-wrap: wrap; align-items: baseline; }
  .block-row b { font: 600 20px var(--mono); }
  .block-row small { display: block; color: var(--muted); font-size: 12px; }
  .bar { height: 6px; background: var(--line); border-radius: 3px; margin-top: 14px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--accent); }
  #chart { position: relative; }
  #chart svg { width: 100%; height: 260px; display: block; }
  #chart .axis { fill: var(--muted); font: 10px var(--mono); }
  #chart .gl { stroke: var(--line); }
  #chart rect.hit { fill: transparent; }
  #chart rect.hit:hover { fill: var(--line); opacity: .4; }
  .tip { position: absolute; pointer-events: none; background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
         padding: 8px 10px; font: 12px var(--mono); white-space: nowrap; display: none; z-index: 2; }
  .legend { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 10px; font: 12px var(--mono); color: var(--muted); }
  .sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
  table { width: 100%; border-collapse: collapse; font: 12.5px var(--mono); }
  th { text-align: left; color: var(--muted); font-weight: 500; padding: 0 0 8px; }
  td { padding: 7px 0; border-top: 1px solid var(--line); }
  th.n, td.n { text-align: right; }
  .share { height: 3px; background: var(--line); border-radius: 2px; margin-top: 4px; }
  .share i { display: block; height: 100%; border-radius: 2px; }
  .err-box { border-color: var(--bad); color: var(--bad); margin-bottom: 14px; font: 12px var(--mono); white-space: pre-wrap; }
  .empty { color: var(--muted); padding: 40px 0; text-align: center; }
  footer { color: var(--muted); font-size: 12px; margin-top: 28px; }
  footer a { color: var(--text); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #111; font-weight: 600; }
  dialog { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 16px; padding: 20px; width: min(920px, 94vw); }
  dialog::backdrop { background: rgba(0,0,0,.6); backdrop-filter: blur(4px); }
  .share-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .share-head h2 { margin: 0; }
  .formats { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  .formats button { background: none; border: 1px solid var(--line); border-radius: 10px; color: var(--muted); padding: 8px 12px; cursor: pointer; text-align: left; font: 12px var(--mono); }
  .formats button b { display: block; color: var(--text); font-size: 13px; }
  .formats button[aria-pressed="true"] { border-color: var(--accent); }
  .preview { display: grid; place-items: center; background: var(--bg); border-radius: 12px; padding: 16px; }
  .preview canvas { max-width: 100%; max-height: 58vh; border-radius: 8px; box-shadow: 0 10px 40px rgba(0,0,0,.4); }
  .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; flex-wrap: wrap; }
  body.card-mode { background: #000; } body.card-mode main { display: none; } body.card-mode #card-out { display: block; }
  #card-out { display: none; }
</style>
</head>
<body>
<main>
  <header>
    <h1><span>cc</span>usage board</h1>
    <div class="status" role="status"><i class="dot" id="dot"></i><span id="updated">connecting…</span></div>
    <div class="spacer"></div>
    <div class="tabs" id="range" aria-label="Date range">
      <button data-d="7">7d</button><button data-d="30" aria-pressed="true">30d</button><button data-d="90">90d</button><button data-d="0">All</button>
    </div>
    <button class="btn" id="refresh">Refresh</button>
    <button class="btn primary" id="share-open">Share</button>
  </header>

  <div class="card err-box" id="error" hidden></div>

  <section class="grid kpis" id="kpis"></section>

  <section class="card" id="block" hidden></section>

  <section class="card">
    <h2>Daily cost by agent</h2>
    <div id="chart"><div class="tip" id="tip"></div></div>
    <div class="legend" id="legend"></div>
  </section>

  <section class="grid two">
    <div class="card"><h2>Agents</h2><table id="agents"></table></div>
    <div class="card"><h2>Models</h2><table id="models"></table></div>
  </section>

  <footer>
    Open source · made by <a href="https://github.com/vugn">Gusti Randa</a> ·
    <a href="https://github.com/vugn/ccusage-board">★ ccusage-board on GitHub</a><br>
    Data from <a href="https://github.com/ryoppippi/ccusage">ccusage</a>, read locally. Nothing leaves your machine.
  </footer>
</main>

<dialog id="share" aria-labelledby="share-title">
  <div class="share-head"><h2 id="share-title">Share your usage</h2><button class="btn" id="share-close" aria-label="Close">✕</button></div>
  <div class="formats" id="formats"></div>
  <div class="preview"><canvas id="card"></canvas></div>
  <div class="actions">
    <button class="btn" id="share-native" hidden>Share…</button>
    <button class="btn" id="share-copy">Copy image</button>
    <button class="btn primary" id="share-save">Download PNG</button>
  </div>
</dialog>
<canvas id="card-out"></canvas>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => `&#${c.charCodeAt(0)};`);
const usd = (n) => '$' + (n >= 1000 ? n.toLocaleString(undefined, { maximumFractionDigits: 0 }) : n.toFixed(2));
const tok = (n) => n >= 1e9 ? (n / 1e9).toFixed(2) + 'B' : n >= 1e6 ? (n / 1e6).toFixed(1) + 'M' : n >= 1e3 ? (n / 1e3).toFixed(1) + 'K' : String(n);
const ymd = (d) => d.toLocaleDateString('en-CA'); // local YYYY-MM-DD

const COLORS = { claude: '#e07a4f', codex: '#5ab0f0', gemini: '#8c7cf0', antigravity: '#47c4a8', opencode: '#e6c34a',
  copilot: '#9aa4b1', cline: '#d066a8', pi: '#7fc35a', hermes: '#f08a8a', amp: '#4fd1e0' };
const FALLBACK = ['#c9a27e', '#6f8fd8', '#b5d26b', '#e39b5b', '#9b7fb8', '#5fb3a1'];
const colorOf = (a, i) => COLORS[a] || FALLBACK[i % FALLBACK.length];

let data = null, days = 30;

function inRange(rows) {
  if (!days) return rows;
  const from = new Date(); from.setDate(from.getDate() - days + 1);
  const f = ymd(from);
  return rows.filter((r) => r.period >= f);
}

function sum(rows, key) { return rows.reduce((s, r) => s + (r[key] || 0), 0); }

function render() {
  if (!data?.daily) return;
  const rows = inRange(data.daily);
  const today = data.daily.find((r) => r.period === ymd(new Date()));
  const cost = sum(rows, 'totalCost'), tokens = sum(rows, 'totalTokens');
  const span = days || Math.max(1, rows.length);
  const label = days ? `last ${days} days` : 'all time';

  $('kpis').innerHTML = [
    ['Today', usd(today?.totalCost || 0), tok(today?.totalTokens || 0) + ' tokens'],
    ['Cost · ' + label, usd(cost), `${rows.length} active days`],
    ['Tokens · ' + label, tok(tokens), `${tok(sum(rows, 'outputTokens'))} output`],
    ['Avg / day', usd(cost / span), `all-time ${usd(data.totals?.totalCost || 0)}`],
  ].map(([l, v, s]) => `<div class="card kpi"><div class="label">${l}</div><div class="value">${v}</div><div class="sub">${s}</div></div>`).join('');

  renderBlock();
  renderChart(rows);
  renderTables(rows);
}

function renderBlock() {
  const b = data.block;
  $('block').hidden = !b;
  if (!b) return;
  const start = new Date(b.startTime), end = new Date(b.endTime), now = Date.now();
  const pct = Math.min(100, Math.max(0, ((now - start) / (end - start)) * 100));
  const left = Math.max(0, Math.round((end - now) / 60000));
  const fmtT = (d) => d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  $('block').innerHTML = `<h2>Active 5-hour block · ${fmtT(start)} – ${fmtT(end)}</h2>
    <div class="block-row">
      <div><small>Spent</small><b>${usd(b.costUSD)}</b></div>
      <div><small>Projected</small><b>${usd(b.projection?.totalCost || b.costUSD)}</b></div>
      <div><small>Burn rate</small><b>${usd(b.burnRate?.costPerHour || 0)}/h</b></div>
      <div><small>Tokens</small><b>${tok(b.totalTokens)}</b></div>
      <div><small>Time left</small><b>${Math.floor(left / 60)}h ${left % 60}m</b></div>
    </div>
    <div class="bar" role="progressbar" aria-valuenow="${pct.toFixed(0)}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div>`;
}

// Daily totals per agent, with missing days filled in as zero so gaps are visible.
function dailySeries(rows) {
  const byDay = new Map(rows.map((r) => [r.period, r]));
  const first = days ? (() => { const d = new Date(); d.setDate(d.getDate() - days + 1); return d; })()
                     : new Date((rows[0]?.period || ymd(new Date())) + 'T00:00');
  const series = [];
  for (const d = new Date(first); ymd(d) <= ymd(new Date()); d.setDate(d.getDate() + 1)) {
    const r = byDay.get(ymd(d));
    const parts = {};
    for (const a of r?.agents || []) parts[a.agent] = (parts[a.agent] || 0) + (a.totalCost || 0);
    series.push({ day: ymd(d), total: r?.totalCost || 0, parts });
  }
  return series;
}
const agentOrder = (rows) => group(rows.flatMap((r) => r.agents || []), 'agent').map((g) => g.name);

function renderChart(rows) {
  const series = dailySeries(rows), agents = agentOrder(rows);
  const W = 1000, H = 260, L = 48, B = 22, T = 8;
  const max = Math.max(1, ...series.map((s) => s.total));
  const step = Math.pow(10, Math.floor(Math.log10(max))), nice = Math.ceil(max / step) * step;
  const y = (v) => T + (H - T - B) * (1 - v / nice);
  const bw = (W - L) / series.length;
  let svg = '';
  for (let i = 0; i <= 4; i++) {
    const v = (nice / 4) * i;
    svg += `<line class="gl" x1="${L}" x2="${W}" y1="${y(v)}" y2="${y(v)}"/><text class="axis" x="${L - 6}" y="${y(v) + 3}" text-anchor="end">${usd(v).replace('.00', '')}</text>`;
  }
  const labelEvery = Math.ceil(series.length / 10);
  series.forEach((s, i) => {
    const x = L + i * bw, w = Math.max(1, bw * 0.72), x0 = x + (bw - w) / 2;
    let acc = 0;
    agents.forEach((a, ai) => {
      const v = s.parts[a] || 0; if (!v) return;
      svg += `<rect x="${x0}" y="${y(acc + v)}" width="${w}" height="${y(acc) - y(acc + v)}" fill="${colorOf(a, ai)}" rx="1"/>`;
      acc += v;
    });
    if (i % labelEvery === 0) svg += `<text class="axis" x="${x + bw / 2}" y="${H - 6}" text-anchor="middle">${s.day.slice(5)}</text>`;
    svg += `<rect class="hit" data-i="${i}" x="${x}" y="${T}" width="${bw}" height="${H - T - B}"/>`;
  });
  const chart = $('chart');
  chart.querySelector('svg')?.remove();
  chart.insertAdjacentHTML('afterbegin', `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Daily cost by agent">${svg}</svg>`);
  chart.querySelector('svg').onmousemove = (e) => {
    const i = e.target.dataset?.i; const tip = $('tip');
    if (i == null) return (tip.style.display = 'none');
    const s = series[i];
    tip.innerHTML = `<b>${s.day}</b> · ${usd(s.total)}<br>` + agents.filter((a) => s.parts[a])
      .map((a) => `<span class="sw" style="background:${colorOf(a, agents.indexOf(a))}"></span>${esc(a)} ${usd(s.parts[a])}`).join('<br>');
    const r = chart.getBoundingClientRect();
    tip.style.display = 'block';
    tip.style.left = Math.min(e.clientX - r.left + 12, r.width - tip.offsetWidth) + 'px';
    tip.style.top = (e.clientY - r.top + 12) + 'px';
  };
  chart.querySelector('svg').onmouseleave = () => ($('tip').style.display = 'none');
  $('legend').innerHTML = agents.map((a, i) => `<span><span class="sw" style="background:${colorOf(a, i)}"></span>${esc(a)}</span>`).join('');
}

function group(items, key) {
  const m = new Map();
  for (const it of items) {
    const g = m.get(it[key]) || { name: it[key], cost: 0, input: 0, output: 0, cache: 0 };
    g.cost += it.totalCost ?? it.cost ?? 0;
    g.input += it.inputTokens || 0; g.output += it.outputTokens || 0;
    g.cache += (it.cacheReadTokens || 0) + (it.cacheCreationTokens || 0);
    m.set(it[key], g);
  }
  return [...m.values()].sort((a, b) => b.cost - a.cost);
}

function table(el, rows, colored) {
  const total = rows.reduce((s, r) => s + r.cost, 0) || 1;
  $(el).innerHTML = rows.length ? `<tr><th>Name</th><th class="n">Input</th><th class="n">Output</th><th class="n">Cache</th><th class="n">Cost</th></tr>` +
    rows.map((r, i) => `<tr><td>${esc(r.name)}<div class="share"><i style="width:${(r.cost / total) * 100}%;background:${colored ? colorOf(r.name, i) : 'var(--accent)'}"></i></div></td>
      <td class="n">${tok(r.input)}</td><td class="n">${tok(r.output)}</td><td class="n">${tok(r.cache)}</td><td class="n">${usd(r.cost)}</td></tr>`).join('')
    : `<tr><td class="empty">No usage in this range</td></tr>`;
}

function renderTables(rows) {
  table('agents', group(rows.flatMap((r) => r.agents || []), 'agent'), true);
  table('models', group(rows.flatMap((r) => r.modelBreakdowns || []), 'modelName'), false);
}

function setStatus() {
  const dot = $('dot');
  if (!data?.updatedAt) return;
  const s = Math.round((Date.now() - new Date(data.updatedAt)) / 1000);
  $('updated').textContent = data.error && !data.daily ? 'error' : `live · updated ${s < 5 ? 'just now' : s + 's ago'}`;
  dot.className = 'dot ' + (data.error === 'loading…' ? '' : data.error ? 'err' : 'live');
}

// ---------- share card ----------
const FORMATS = {
  story:  { w: 1080, h: 1920, name: 'Story 9:16', hint: 'IG · TikTok · WhatsApp' },
  post:   { w: 1080, h: 1350, name: 'Post 4:5', hint: 'Instagram feed' },
  square: { w: 1080, h: 1080, name: 'Square 1:1', hint: 'X · Threads · Discord' },
  wide:   { w: 1920, h: 1080, name: 'Wide 16:9', hint: 'LinkedIn · slides · desktop' },
};
const MONO = '"SF Mono", "JetBrains Mono", Menlo, Consolas, monospace';
const SANS = 'system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
const REPO = 'github.com/vugn/ccusage-board';
let fmt = 'story', grain;

function cardStats() {
  const rows = inRange(data.daily), cost = sum(rows, 'totalCost');
  const fmtD = (p) => new Date(p + 'T00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
  return {
    cost, tokens: sum(rows, 'totalTokens'), activeDays: rows.length, avg: cost / (days || Math.max(1, rows.length)),
    agents: group(rows.flatMap((r) => r.agents || []), 'agent'),
    topModel: group(rows.flatMap((r) => r.modelBreakdowns || []), 'modelName')[0]?.name || '—',
    series: dailySeries(rows), label: days ? `Last ${days} days` : 'All time',
    span: rows.length ? `${fmtD(rows[0].period)} – ${fmtD(rows.at(-1).period)}` : '',
  };
}

const hexA = (hex, a) => `rgba(${[1, 3, 5].map((i) => parseInt(hex.slice(i, i + 2), 16)).join(',')},${a})`;
function fit(c, text, maxW, size, weight, family) {
  do c.font = `${weight} ${size}px ${family}`; while (c.measureText(text).width > maxW && (size -= 2) > 10);
  return size;
}

function drawCard(canvas, key) {
  const { w, h } = FORMATS[key], st = cardStats(), order = st.agents.map((g) => g.name);
  canvas.width = w; canvas.height = h;
  const c = canvas.getContext('2d'), s = Math.min(w, h) / 1080, P = 84 * s;
  const WHITE = '#f4f2ee', MUTED = 'rgba(244,242,238,.55)';

  // Background: near-black, two soft glows, film grain, inset frame.
  c.fillStyle = '#0b0c0e'; c.fillRect(0, 0, w, h);
  const glow = (x, y, r, col) => { const g = c.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, col); g.addColorStop(1, 'rgba(0,0,0,0)'); c.fillStyle = g; c.fillRect(0, 0, w, h); };
  glow(w * 0.08, h * 0.04, Math.max(w, h) * 0.62, 'rgba(242,169,59,.24)');
  glow(w * 0.96, h * 0.97, Math.max(w, h) * 0.55, hexA(colorOf(order[0] || 'claude', 0), 0.2));
  if (!grain) {
    grain = document.createElement('canvas'); grain.width = grain.height = 160;
    const g = grain.getContext('2d'), img = g.createImageData(160, 160);
    for (let i = 0; i < img.data.length; i += 4) { img.data[i] = img.data[i + 1] = img.data[i + 2] = Math.random() * 255; img.data[i + 3] = 14; }
    g.putImageData(img, 0, 0);
  }
  c.fillStyle = c.createPattern(grain, 'repeat'); c.fillRect(0, 0, w, h);
  c.strokeStyle = 'rgba(255,255,255,.08)'; c.lineWidth = 2 * s;
  c.beginPath(); c.roundRect(26 * s, 26 * s, w - 52 * s, h - 52 * s, 38 * s); c.stroke();

  const label = (t, x, y) => { c.font = `600 ${22 * s}px ${SANS}`; c.fillStyle = 'rgba(244,242,238,.45)'; c.letterSpacing = `${3 * s}px`; c.fillText(t, x, y); c.letterSpacing = '0px'; };
  const right = (t, x, y) => { c.textAlign = 'right'; c.fillText(t, x, y); c.textAlign = 'left'; };

  const header = { h: 56 * s, draw(x, y, cw) {
    c.font = `700 ${40 * s}px ${MONO}`; c.fillStyle = '#f2a93b'; c.fillText('cc', x, y + 42 * s);
    const cc = c.measureText('cc').width; c.fillStyle = WHITE; c.fillText('usage', x + cc, y + 42 * s);
    c.font = `500 ${24 * s}px ${MONO}`; const tw = c.measureText(st.label).width + 40 * s;
    c.fillStyle = 'rgba(255,255,255,.07)'; c.beginPath(); c.roundRect(x + cw - tw, y + 4 * s, tw, 48 * s, 24 * s); c.fill();
    c.fillStyle = WHITE; right(st.label, x + cw - 20 * s, y + 37 * s);
  } };

  const hero = { h: 330 * s, draw(x, y, cw) {
    label('SPENT ON AI CODING AGENTS', x, y + 26 * s);
    const text = usd(st.cost), size = fit(c, text, cw, 210 * s, 700, MONO);
    const g = c.createLinearGradient(x, 0, x + cw, 0); g.addColorStop(0, WHITE); g.addColorStop(1, '#f2a93b');
    c.fillStyle = g; c.fillText(text, x - size * 0.04, y + 60 * s + size * 0.82);
    c.font = `400 ${30 * s}px ${SANS}`; c.fillStyle = MUTED;
    c.fillText(`${tok(st.tokens)} tokens${st.span ? ' · ' + st.span : ''}`, x, y + 318 * s);
  } };

  const stats = (cols) => {
    const items = [['Tokens', tok(st.tokens)], ['Active days', String(st.activeDays)], ['Avg / day', usd(st.avg)], ['Top model', st.topModel]];
    const rows = 4 / cols, ch = 130 * s, gap = 18 * s;
    return { h: rows * ch + (rows - 1) * gap, draw(x, y, cw) {
      const iw = (cw - gap * (cols - 1)) / cols;
      items.forEach(([k, v], i) => {
        const ix = x + (i % cols) * (iw + gap), iy = y + Math.floor(i / cols) * (ch + gap);
        c.fillStyle = 'rgba(255,255,255,.045)'; c.strokeStyle = 'rgba(255,255,255,.08)'; c.lineWidth = 1.5 * s;
        c.beginPath(); c.roundRect(ix, iy, iw, ch, 22 * s); c.fill(); c.stroke();
        c.font = `500 ${22 * s}px ${SANS}`; c.fillStyle = MUTED; c.fillText(k, ix + 24 * s, iy + 44 * s);
        fit(c, v, iw - 48 * s, 40 * s, 700, MONO); c.fillStyle = WHITE; c.fillText(v, ix + 24 * s, iy + 100 * s);
      });
    } };
  };

  const chart = (ph) => ({ h: (ph + 44) * s, draw(x, y, cw, ch) {
    label('DAILY COST', x, y + 22 * s);
    const ser = st.series, top = y + 44 * s, hh = ch - 44 * s, max = Math.max(1e-9, ...ser.map((d) => d.total));
    const bw = cw / Math.max(1, ser.length), pad = Math.min(bw * 0.28, 6 * s);
    ser.forEach((d, i) => {
      const bx = x + i * bw + pad / 2, bwi = Math.max(1, bw - pad);
      if (!d.total) { c.fillStyle = 'rgba(255,255,255,.07)'; c.fillRect(bx, top + hh - 3 * s, bwi, 3 * s); return; }
      let acc = 0;
      order.forEach((a, ai) => {
        const v = d.parts[a] || 0; if (!v) return;
        const y1 = top + hh * (1 - (acc + v) / max), y0 = top + hh * (1 - acc / max);
        c.fillStyle = colorOf(a, ai); c.fillRect(bx, y1, bwi, y0 - y1); acc += v;
      });
    });
  } });

  const agents = (n) => {
    const list = st.agents.slice(0, n);
    return { h: (88 + list.length * 54) * s, draw(x, y, cw) {
      label('BY AGENT', x, y + 22 * s);
      const by = y + 40 * s, tot = st.cost || 1;
      c.save(); c.beginPath(); c.roundRect(x, by, cw, 22 * s, 11 * s); c.clip();
      c.fillStyle = 'rgba(255,255,255,.07)'; c.fillRect(x, by, cw, 22 * s);
      let bx = x;
      st.agents.forEach((g, i) => { const bw = (cw * g.cost) / tot; c.fillStyle = colorOf(g.name, i); c.fillRect(bx, by, bw, 22 * s); bx += bw; });
      c.restore();
      list.forEach((g, i) => {
        const ry = by + 22 * s + 26 * s + i * 54 * s + 34 * s;
        c.fillStyle = colorOf(g.name, i); c.beginPath(); c.arc(x + 9 * s, ry - 10 * s, 9 * s, 0, Math.PI * 2); c.fill();
        c.font = `500 ${30 * s}px ${SANS}`; c.fillStyle = WHITE; c.fillText(g.name, x + 32 * s, ry);
        c.font = `600 ${28 * s}px ${MONO}`; right(usd(g.cost), x + cw - 110 * s, ry);
        c.fillStyle = MUTED; right(`${Math.round((g.cost / tot) * 100)}%`, x + cw, ry);
      });
    } };
  };

  const footer = { h: 40 * s, draw(x, y, cw) {
    c.font = `500 ${22 * s}px ${MONO}`; c.fillStyle = MUTED;
    c.fillText('made with ccusage-board', x, y + 30 * s); right(REPO, x + cw, y + 30 * s);
  } };

  // Lay sections top to bottom, spreading leftover height evenly between them.
  const stack = (x, y, cw, ch, secs) => {
    const gap = (ch - secs.reduce((t, k) => t + k.h, 0)) / (secs.length - 1);
    for (const k of secs) { k.draw(x, y, cw, k.h); y += k.h + gap; }
  };
  const ratio = h / w;
  if (w > h) {
    const cw = (w - P * 3) / 2;
    stack(P, P, cw, h - 2 * P, [header, hero, stats(2), footer]);
    stack(P * 2 + cw, P, cw, h - 2 * P, [chart(420), agents(5)]);
  } else if (ratio > 1.5) stack(P, P, w - 2 * P, h - 2 * P, [header, hero, stats(2), chart(400), agents(5), footer]);
  else if (ratio > 1.1) stack(P, P, w - 2 * P, h - 2 * P, [header, hero, stats(4), chart(190), agents(3), footer]);
  else stack(P, P, w - 2 * P, h - 2 * P, [header, hero, stats(4), agents(3), footer]);
}

const cardBlob = () => new Promise((r) => $('card').toBlob(r, 'image/png'));
const fileName = () => `ccusage-${fmt}-${ymd(new Date())}.png`;
const flash = (el, msg) => { const t = el.textContent; el.textContent = msg; setTimeout(() => (el.textContent = t), 1500); };

$('share-open').onclick = () => {
  if (!data?.daily) return;
  $('formats').innerHTML = Object.entries(FORMATS).map(([k, f]) => `<button data-k="${k}" aria-pressed="${k === fmt}"><b>${f.name}</b>${f.hint}</button>`).join('');
  drawCard($('card'), fmt);
  $('share').showModal();
};
$('formats').onclick = (e) => {
  const b = e.target.closest('button'); if (!b) return;
  fmt = b.dataset.k;
  for (const x of $('formats').children) x.setAttribute('aria-pressed', x === b);
  drawCard($('card'), fmt);
};
$('share-close').onclick = () => $('share').close();
$('share-save').onclick = async () => {
  const url = URL.createObjectURL(await cardBlob());
  Object.assign(document.createElement('a'), { href: url, download: fileName() }).click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
};
$('share-copy').onclick = async (e) => {
  try { await navigator.clipboard.write([new ClipboardItem({ 'image/png': cardBlob() })]); flash(e.target, 'Copied!'); }
  catch { flash(e.target, 'Copy not supported'); }
};
$('share-native').hidden = !navigator.canShare?.({ files: [new File([''], 'x.png', { type: 'image/png' })] });
$('share-native').onclick = async () => {
  const file = new File([await cardBlob()], fileName(), { type: 'image/png' });
  navigator.share({ files: [file], text: `My AI coding usage · ${REPO}` }).catch(() => {});
};

// ---------- boot ----------
const params = new URLSearchParams(location.search);
if (params.has('card')) {
  // ?card=story|post|square|wide&range=30 renders only the image (handy for screenshots).
  document.body.classList.add('card-mode');
  if (params.has('range')) days = Number(params.get('range'));
  fetch('/api/usage').then((r) => r.json()).then((d) => { data = d; drawCard($('card-out'), FORMATS[params.get('card')] ? params.get('card') : 'story'); });
} else {
  const es = new EventSource('/events');
  es.onmessage = (e) => {
    data = JSON.parse(e.data);
    $('error').hidden = !data.error || data.error === 'loading…';
    $('error').textContent = 'ccusage error: ' + data.error;
    if (data.error === 'loading…') $('updated').textContent = 'running ccusage…';
    render(); setStatus();
    if ($('share').open) drawCard($('card'), fmt);
  };
  es.onerror = () => { $('dot').className = 'dot err'; $('updated').textContent = 'disconnected — retrying'; };
  setInterval(() => { setStatus(); if (data?.block) renderBlock(); }, 1000);
}

$('range').onclick = (e) => {
  const b = e.target.closest('button'); if (!b) return;
  days = Number(b.dataset.d);
  for (const x of $('range').children) x.setAttribute('aria-pressed', x === b);
  render();
};
$('refresh').onclick = async (e) => {
  e.target.disabled = true; e.target.textContent = 'Refreshing…';
  await fetch('/api/refresh', { method: 'POST' }).catch(() => {});
  e.target.disabled = false; e.target.textContent = 'Refresh';
};
</script>
